<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SF Mono',Consolas,monospace">
  <rect width="1280" height="440" fill="#0A0B0F"/>
  <text x="40" y="52" font-size="20" font-weight="700" fill="#F0F1F3">Black-box pipeline</text>
  <text x="40" y="78" font-size="13" fill="#525A67">Every finding is confirmed by a tool before it reaches the report. Reasoning on top of a deterministic sweep.</text>

  <!-- stage nodes -->
  <g font-size="14" font-weight="600">
    <!-- row of 8 -->
    <g transform="translate(40,120)">
      <rect width="132" height="58" rx="10" fill="#0F1117" stroke="#C8F135" stroke-opacity="0.35"/>
      <text x="66" y="27" text-anchor="middle" fill="#C8F135">recon</text>
      <text x="66" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">nmap · subfinder</text>
    </g>
    <g transform="translate(196,120)">
      <rect width="132" height="58" rx="10" fill="#0F1117" stroke="#2DE2E6" stroke-opacity="0.35"/>
      <text x="66" y="27" text-anchor="middle" fill="#2DE2E6">crawl</text>
      <text x="66" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">JS-aware, params</text>
    </g>
    <g transform="translate(352,120)">
      <rect width="132" height="58" rx="10" fill="#0F1117" stroke="#2DE2E6" stroke-opacity="0.35"/>
      <text x="66" y="27" text-anchor="middle" fill="#2DE2E6">sweep</text>
      <text x="66" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">48 detectors</text>
    </g>
    <g transform="translate(508,120)">
      <rect width="132" height="58" rx="10" fill="#0F1117" stroke="#F0C27F" stroke-opacity="0.4"/>
      <text x="66" y="27" text-anchor="middle" fill="#F0C27F">business-logic</text>
      <text x="66" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">price/role abuse</text>
    </g>
    <g transform="translate(664,120)">
      <rect width="132" height="58" rx="10" fill="#0F1117" stroke="#C8F135" stroke-opacity="0.5"/>
      <text x="66" y="27" text-anchor="middle" fill="#C8F135">LLM hunt</text>
      <text x="66" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">parallel agents</text>
    </g>
    <g transform="translate(820,120)">
      <rect width="132" height="58" rx="10" fill="#0F1117" stroke="#9B6DFF" stroke-opacity="0.5"/>
      <text x="66" y="27" text-anchor="middle" fill="#9B6DFF">debate</text>
      <text x="66" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">attacker/defender</text>
    </g>
    <g transform="translate(976,120)">
      <rect width="132" height="58" rx="10" fill="#0F1117" stroke="#FF6B6B" stroke-opacity="0.4"/>
      <text x="66" y="27" text-anchor="middle" fill="#FF6B6B">chains</text>
      <text x="66" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">combine impact</text>
    </g>
    <g transform="translate(1132,120)">
      <rect width="108" height="58" rx="10" fill="#0F1117" stroke="#64D8A3" stroke-opacity="0.5"/>
      <text x="54" y="27" text-anchor="middle" fill="#64D8A3">report</text>
      <text x="54" y="46" text-anchor="middle" font-size="10" font-weight="400" fill="#525A67">PoC + fix</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#3A4150" stroke-width="1.5" fill="none">
    <path d="M172 149 H196" marker-end="url(#a)"/>
    <path d="M328 149 H352" marker-end="url(#a)"/>
    <path d="M484 149 H508" marker-end="url(#a)"/>
    <path d="M640 149 H664" marker-end="url(#a)"/>
    <path d="M796 149 H820" marker-end="url(#a)"/>
    <path d="M952 149 H976" marker-end="url(#a)"/>
    <path d="M1108 149 H1132" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#3A4150"/></marker></defs>

  <!-- coverage strip -->
  <text x="40" y="248" font-size="15" font-weight="700" fill="#F0F1F3">Tool-confirmed coverage</text>
  <g font-size="12" fill="#9199A6" transform="translate(40,272)">
    <g><rect width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/><text x="16" y="17">SQLi · XSS · RCE</text></g>
    <g transform="translate(162,0)"><rect width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/><text x="16" y="17">SSTI · XXE · SSRF</text></g>
    <g transform="translate(324,0)"><rect width="170" height="26" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/><text x="16" y="17">IDOR · NoSQL · JWT</text></g>
    <g transform="translate(506,0)"><rect width="190" height="26" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/><text x="16" y="17">SSRF→cloud creds</text></g>
    <g transform="translate(708,0)"><rect width="180" height="26" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/><text x="16" y="17">deserialization</text></g>
    <g transform="translate(900,0)"><rect width="200" height="26" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/><text x="16" y="17">GraphQL · smuggling</text></g>
  </g>

  <!-- white-box note -->
  <text x="40" y="356" font-size="15" font-weight="700" fill="#F0F1F3">White-box</text>
  <text x="40" y="380" font-size="12" fill="#9199A6">Point it at a repo: reasoning-based taint analysis, adversarial validation to kill false positives, ready-to-apply fix code.</text>

  <text x="40" y="416" font-size="11" fill="#3A4150">Authorization gate refuses any host it is not allowed to test. Non-destructive by default.</text>
</svg>
