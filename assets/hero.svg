<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SF Mono',ui-monospace,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07080B"/><stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.0" r="0.9">
      <stop stop-color="#C8F135" stop-opacity="0.13"/><stop offset="1" stop-color="#C8F135" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.95" cy="1.0" r="0.8">
      <stop stop-color="#2DE2E6" stop-opacity="0.10"/><stop offset="1" stop-color="#2DE2E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#g1)"/>
  <rect width="1280" height="340" fill="url(#g2)"/>
  <rect x="0" y="0" width="1280" height="2.5" fill="#C8F135" fill-opacity="0.55"/>

  <!-- wordmark -->
  <g transform="translate(90,120)">
    <circle cx="13" cy="0" r="11" fill="#C8F135"/>
    <text x="52" y="26" font-size="84" font-weight="700" fill="#F2F3F5" letter-spacing="-2">KRYX</text>
  </g>

  <text x="92" y="196" font-size="21" fill="#B7BEC9" font-weight="500">Autonomous offensive-security agent</text>
  <text x="92" y="226" font-size="15" fill="#6B7280">Finds vulnerabilities, proves each by execution, chains them to real impact, writes the fix.</text>

  <!-- metric pills -->
  <g transform="translate(92,262)" font-size="14" font-weight="600">
    <g>
      <rect width="150" height="34" rx="17" fill="#C8F135" fill-opacity="0.08" stroke="#C8F135" stroke-opacity="0.30"/>
      <text x="20" y="22" fill="#C8F135">48 detectors</text>
    </g>
    <g transform="translate(166,0)">
      <rect width="212" height="34" rx="17" fill="#2DE2E6" fill-opacity="0.07" stroke="#2DE2E6" stroke-opacity="0.28"/>
      <text x="20" y="22" fill="#2DE2E6">proven by execution</text>
    </g>
    <g transform="translate(394,0)">
      <rect width="196" height="34" rx="17" fill="#64D8A3" fill-opacity="0.07" stroke="#64D8A3" stroke-opacity="0.28"/>
      <text x="20" y="22" fill="#64D8A3">~0 false positives</text>
    </g>
    <g transform="translate(606,0)">
      <rect width="196" height="34" rx="17" fill="#9B6DFF" fill-opacity="0.07" stroke="#9B6DFF" stroke-opacity="0.28"/>
      <text x="20" y="22" fill="#B79BFF">adversarial debate</text>
    </g>
  </g>
</svg>
