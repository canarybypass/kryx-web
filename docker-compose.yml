services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./kryx.db
      KRYX_SANDBOX_DIR: /tmp/kryx-sandbox
    volumes:
      - sandbox:/tmp/kryx-sandbox
      - dbdata:/app/kryx.db
    networks:
      - kryx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kryx

volumes:
  dbdata:
  sandbox:

networks:
  kryx:
    driver: bridge
