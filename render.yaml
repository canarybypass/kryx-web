services:
  - type: web
    name: kryx-web-api
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./kryx.db
      - key: CORS_ORIGINS
        value: https://kryx-web-front.onrender.com
      - key: KRYX_MODEL
        value: openrouter/meta-llama/llama-3.3-70b-instruct:free
      - key: OPENROUTER_FALLBACKS
        value: deepseek/deepseek-chat-v3-0324:free,meta-llama/llama-3.1-8b-instruct:free
      - key: OPENROUTER_JSON_MODE
        value: "0"
      - key: OPENROUTER_MAX_TOKENS
        value: "4000"

  - type: static
    name: kryx-web-front
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://kryx-web-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
